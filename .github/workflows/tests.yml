name: API tests

on:
  push:
    branches:
      - feature/authentication-hardening
      - feature/document-ownership
      - feature/rag-resource-hardening
      - feature/runtime-config-security
      - feature/gemini-sdk-migration
      - docs/api-and-security-overview
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1.0" "sqlalchemy>=2.0,<3.0" "python-jose[cryptography]>=3.3,<4.0" "bcrypt>=4.2,<6.0" "python-multipart>=0.0.20,<1.0" "python-dotenv>=1.0,<2.0" "pydantic[email]>=2.10,<3.0" "pydantic-settings>=2.7,<3.0" "numpy>=1.26,<3.0" "pypdf>=5.1,<6.0" "google-genai>=2.29,<3.0" "pytest>=8.0,<9.0" "httpx>=0.27,<1.0"
      - name: Run tests
        run: pytest -q
