name: Secret scan

on:
  push:
    branches:
      - feature/authentication-hardening
      - feature/document-ownership
      - feature/rag-resource-hardening
      - feature/runtime-config-security
      - feature/gemini-sdk-migration
      - docs/api-and-security-overview
      - security/secret-scanning
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
