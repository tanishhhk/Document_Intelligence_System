# Render Blueprint: the API on a free Docker web service with a free PostgreSQL.
# Deploy: https://render.com/deploy?repo=https://github.com/tanishhhk/guruKool
# Render asks for the two values marked sync: false (the model keys).
services:
  - type: web
    name: gurucool-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gurucool-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDERS
        value: groq,openrouter
      - key: CORS_ORIGINS
        value: '["https://tanishhhk.github.io"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      # Sized for 512 MB and 0.1 CPU: fewer parallel model calls, and child
      # processes for PDF parsing and video rendering capped below the limit.
      # The re-ranker adds about 100 MB for a 0.002 MRR gain; off on 512 MB.
      - key: RERANKER_ENABLED
        value: "false"
      - key: LLM_MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: PDF_PARSE_MEMORY_MB
        value: "256"
      - key: VIDEO_RENDER_MEMORY_MB
        value: "320"
      - key: LOG_FORMAT
        value: json
      - key: API_DOCS_ENABLED
        value: "false"

databases:
  - name: gurucool-db
    plan: free
    region: singapore
    databaseName: gurucool
    user: gurucool
